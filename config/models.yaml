# local-llm-sim Model Configuration
# Each model has two versions:
#   - :m3  = Mac Studio M3 Ultra simulation (with latency)
#   - :api = Direct API access (no latency, for benchmarking)

hardware:
  name: "Mac Studio M3 Ultra 512GB"
  description: "Apple Silicon with 512GB unified memory, ~800 GB/s bandwidth"

models:
  # =============================================================================
  # DeepSeek V3 - 671B MoE, 37B active parameters
  # =============================================================================

  deepseek-v3:m3:
    backend: "deepseek/deepseek-chat-v3-0324"
    display_name: "DeepSeek V3 [M3 Ultra]"
    description: "671B MoE - Simulated on Mac Studio M3 Ultra"
    latency:
      prefill_tps: 400
      decode_tps: 20
    parameters:
      size: "671B"
      quantization: "Q4_K_M"
      context_length: 128000
    defaults:
      temperature: 0.7
      top_p: 0.9
    capabilities:
      tools: true
      vision: false
      embeddings: false
    size_bytes: 404000000000

  deepseek-v3:api:
    backend: "deepseek/deepseek-chat-v3-0324"
    display_name: "DeepSeek V3 [API]"
    description: "671B MoE - Direct API (no latency simulation)"
    latency:
      prefill_tps: 999999
      decode_tps: 999999
    parameters:
      size: "671B"
      context_length: 128000
    defaults:
      temperature: 0.7
      top_p: 0.9
    capabilities:
      tools: true
      vision: false
      embeddings: false
    size_bytes: 0

  # =============================================================================
  # DeepSeek R1 - 671B MoE, reasoning optimized
  # =============================================================================

  deepseek-r1:m3:
    backend: "deepseek/deepseek-r1"
    display_name: "DeepSeek R1 [M3 Ultra]"
    description: "671B Reasoning - Simulated on Mac Studio M3 Ultra"
    latency:
      prefill_tps: 350
      decode_tps: 18
    parameters:
      size: "671B"
      quantization: "Q4_K_M"
      context_length: 128000
    defaults:
