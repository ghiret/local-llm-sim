    display_name: "DeepSeek R1 [API]"
    description: "671B Reasoning - Direct API (no latency simulation)"
    latency:
      prefill_tps: 999999
      decode_tps: 999999
    parameters:
      size: "671B"
      context_length: 128000
    defaults:
      temperature: 0.6
    capabilities:
